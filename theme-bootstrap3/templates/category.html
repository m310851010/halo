<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = null, content = ~{::content})}">
<th:block th:fragment="content">
  <!-- 分类页：左侧当前语言分类导航，右侧产品卡片网格 -->
  <div class="panel panel-default">
    <div class="panel-heading" th:text="${category != null} ? ${category.spec.displayName} : ''"></div>
    <div class="panel-body">
      <!-- 当前语言的分类导航 -->
      <div class="theme-cat-nav">
        <a class="label theme-cat-pill"
           th:each="c : ${isEn ? enCats : zhCats}"
           th:href="@{${c.status.permalink}}"
           th:classappend="${category != null && c.metadata.name == category.metadata.name} ? 'label-primary' : 'label-default'"
           th:text="${c.spec.displayName}"></a>
      </div>
      <hr/>
      <!-- 产品卡片网格 -->
      <div class="row">
        <div class="col-md-3 col-sm-4 col-xs-6" th:each="post : ${posts.items}">
          <a class="panel panel-default theme-product-card" th:href="@{${post.status.permalink}}">
            <div class="theme-product-img">
              <img class="img-responsive" th:if="${post.spec.cover != null}"
                   th:src="${post.spec.cover}" th:alt="${post.spec.title}"
                   th:attr="loading='lazy'"/>
              <span class="glyphicon glyphicon-picture theme-noimg" th:if="${post.spec.cover == null}"></span>
            </div>
            <div class="panel-body text-center">
              <span class="theme-product-title" th:text="${post.spec.title}"></span>
            </div>
          </a>
        </div>
      </div>
      <p class="text-center text-muted" th:if="${#lists.isEmpty(posts.items)}"
         th:text="#{section.noProducts}"></p>
    </div>
    <div class="panel-footer text-center">
      <ul class="pagination theme-pagination-none" style="margin:0">
        <li th:if="${posts.hasPrevious()}"><a th:href="@{${posts.prevUrl}}">&laquo;</a></li>
        <li class="disabled" th:unless="${posts.hasPrevious()}"><span>&laquo;</span></li>
        <li th:if="${posts.hasNext()}"><a th:href="@{${posts.nextUrl}}">&raquo;</a></li>
        <li class="disabled" th:unless="${posts.hasNext()}"><span>&raquo;</span></li>
      </ul>
    </div>
  </div>
</th:block>
</html>
