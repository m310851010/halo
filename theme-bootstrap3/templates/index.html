<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head = null, content = ~{::content})}">
<th:block th:fragment="content">
  <div class="panel panel-default" th:each="post : ${posts.items}">
    <div class="panel-body">
      <h2 class="media-heading theme-post-title">
        <a th:href="@{${post.status.permalink}}" th:text="${post.spec.title}"></a>
      </h2>
      <p class="text-muted">
        <span class="glyphicon glyphicon-calendar" aria-hidden="true"></span>
        <time th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd HH:mm')}"></time>
        <span th:if="${post.spec.cover}" class="theme-tag-space"></span>
        <span class="glyphicon glyphicon-folder-open" aria-hidden="true"
              th:if="${!#lists.isEmpty(post.categories)}"></span>
        <a class="label label-primary theme-label"
           th:each="category : ${post.categories}"
           th:href="@{${category.status.permalink}}"
           th:text="${category.spec.displayName}"></a>
      </p>
      <p class="theme-excerpt" th:text="${post.status.excerpt}"></p>
      <p>
        <a class="btn btn-default btn-sm" th:href="@{${post.status.permalink}}">
          阅读全文 <span class="glyphicon glyphicon-chevron-right" aria-hidden="true"></span>
        </a>
      </p>
    </div>
  </div>

  <div class="panel panel-default" th:if="${#lists.isEmpty(posts.items)}">
    <div class="panel-body text-center text-muted">
      还没有发布任何文章。
    </div>
  </div>

  <nav class="text-center" aria-label="分页">
    <ul class="pagination">
      <li th:if="${posts.hasPrevious()}">
        <a th:href="@{${posts.prevUrl}}" aria-label="上一页">&laquo; 上一页</a>
      </li>
      <li class="disabled" th:unless="${posts.hasPrevious()}">
        <span>&laquo; 上一页</span>
      </li>
      <li th:if="${posts.hasNext()}">
        <a th:href="@{${posts.nextUrl}}" aria-label="下一页">下一页 &raquo;</a>
      </li>
      <li class="disabled" th:unless="${posts.hasNext()}">
        <span>下一页 &raquo;</span>
      </li>
    </ul>
  </nav>
</th:block>
</html>
