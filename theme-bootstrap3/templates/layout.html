<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:halo="urn:org.halo.thymeleaf"
      th:fragment="html (head, content)">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${site.title}"></title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/assets/css/style.css?v={v}(v=${theme.spec.version})}"/>
  <th:block th:if="${head != null}">
    <th:block th:replace="${head}"/>
  </th:block>
</head>
<!--
  语言判定（Halo 原生 ThemeLocaleContextResolver 优先级）：
  ?language= 参数 > language cookie > 登录用户语言 > 浏览器 Accept-Language。
  站点固定内容（标题/联系/页脚/横幅/界面文案）全部来自主题设置的双语字段对
  （xxx_zh / xxx_en），Console 可视化编辑；内容部分（文章/产品/页面）按语言
  分两套由用户编辑。
-->
<body th:with="isEn=${#locale.language == 'en'},
                 S = ${theme.config.site},
                 B = ${theme.config.banner},
                 K = ${theme.config.contact},
                 T = ${theme.config.sections},
                 G = ${theme.config.general},
                 siteTitle = ${isEn ? S?.title_en : S?.title_zh},
                 siteSubtitle = ${isEn ? S?.subtitle_en : S?.subtitle_zh},
                 primaryMenu = ${menuFinder.getByName(isEn ? 'primary-en' : 'primary')}">
<nav class="navbar navbar-static-top"
     th:classappend="${theme.config.header?.navbar_style} ?: 'navbar-inverse'">
  <div class="container">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
              data-target="#theme-navbar" aria-expanded="false">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" th:href="@{/}" th:text="${siteTitle}"></a>
    </div>
    <div class="collapse navbar-collapse" id="theme-navbar">
      <ul class="nav navbar-nav navbar-right">
        <li th:each="item : ${primaryMenu?.menuItems}">
          <a th:href="@{${item.status.href}}" th:text="${item.status.displayName}"
             th:attr="target=${item.spec.target != null ? item.spec.target : null}"></a>
        </li>
        <li class="dropdown theme-lang">
          <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button"
             aria-haspopup="true" aria-expanded="false">
            <span class="glyphicon glyphicon-globe" aria-hidden="true"></span>
            <span th:text="${isEn ? 'English' : '中文'}"></span>
            <span class="caret"></span>
          </a>
          <ul class="dropdown-menu">
            <li th:if="${isEn}"><a href="#" onclick="setLang('zh-CN')">中文</a></li>
            <li th:unless="${isEn}"><a href="#" onclick="setLang('en')">English</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container theme-main">
  <div class="row">
    <div class="col-md-9 col-sm-12">
      <th:block th:replace="${content}"/>
    </div>
    <div class="col-md-3 col-sm-12 theme-sidebar">
      <div class="panel panel-default">
        <div class="panel-heading" th:text="${isEn ? K?.contact_title_en : K?.contact_title_zh}"></div>
        <div class="panel-body theme-contact-mini">
          <p>
            <span class="glyphicon glyphicon-phone" aria-hidden="true"></span>
            <a th:href="'tel:' + ${#strings.replace(K?.mobile ?: '', ' ', '')}" th:text="${K?.mobile}"></a>
          </p>
          <p>
            <span class="glyphicon glyphicon-earphone" aria-hidden="true"></span>
            <span th:text="${K?.phone}"></span>
          </p>
          <p>
            <span class="glyphicon glyphicon-envelope" aria-hidden="true"></span>
            <a th:href="'mailto:' + ${K?.email ?: ''}" th:text="${K?.email}"></a>
          </p>
          <p>
            <span class="glyphicon glyphicon-map-marker" aria-hidden="true"></span>
            <span th:text="${isEn ? K?.address_en : K?.address_zh}"></span>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="theme-footer">
  <div class="container text-center">
    <p th:utext="${isEn ? G?.footer_text_en : G?.footer_text_zh}"></p>
    <p>
      <small th:text="${siteTitle} + ' © ' + ${#temporals.format(#temporals.createNow(), 'yyyy')}"></small>
    </p>
  </div>
</footer>

<script th:src="@{/assets/js/jquery.min.js}"></script>
<script th:src="@{/assets/js/bootstrap.min.js}"></script>
<script>
  function setLang(lang) {
    document.cookie = 'language=' + lang + ';path=/;max-age=31536000';
    location.reload();
  }
</script>

</body>
</html>
