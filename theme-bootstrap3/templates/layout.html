<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:halo="urn:org.halo.thymeleaf"
      th:fragment="html (head, content)">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${site.title}"></title>
  <link rel="stylesheet" th:href="@{/assets/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/assets/css/style.css?v={v}(v=${theme.spec.version})}"/>
  <th:block th:if="${head != null}">
    <th:block th:replace="${head}"/>
  </th:block>
</head>
<body th:attr="data-i18n-base=${theme.config.i18n?.strings}">
<nav class="navbar navbar-static-top"
     th:classappend="${theme.config.header?.navbar_style} ?: 'navbar-inverse'">
  <div class="container">
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
              data-target="#theme-navbar" aria-expanded="false">
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" th:href="@{/}" th:text="${site.title}"></a>
    </div>
    <!-- 导航菜单从 CMS 的 primary 菜单读取；语言切换按钮由 JS 控制 -->
    <div class="collapse navbar-collapse" id="theme-navbar"
         th:with="primaryMenu = ${menuFinder.getByName('primary')}">
      <ul class="nav navbar-nav navbar-right">
        <li th:each="item : ${primaryMenu?.menuItems}">
          <a th:href="@{${item.status.href}}" th:text="${item.status.displayName}"
             th:attr="data-i18n-key=${'menu.' + item.status.displayName},target=${item.spec.target != null ? item.spec.target : null}"></a>
        </li>
        <li class="dropdown theme-lang">
          <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button"
             aria-haspopup="true" aria-expanded="false">
            <span class="glyphicon glyphicon-globe" aria-hidden="true"></span>
            <span class="theme-lang-current">中文</span>
            <span class="caret"></span>
          </a>
          <ul class="dropdown-menu">
            <li><a href="#" class="theme-lang-pick" data-lang="zh-CN">中文</a></li>
            <li><a href="#" class="theme-lang-pick" data-lang="en">English</a></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container theme-main">
  <div class="row">
    <div class="col-md-9 col-sm-12">
      <th:block th:replace="${content}"/>
    </div>
    <div class="col-md-3 col-sm-12 theme-sidebar">
      <div class="panel panel-default">
        <div class="panel-heading" data-i18n-key="sidebar.contact">联系我们</div>
        <div class="panel-body theme-contact-mini">
          <p>
            <span class="glyphicon glyphicon-phone" aria-hidden="true"></span>
            <a th:href="'tel:' + ${#strings.replace(theme.config.footer?.mobile ?: '', ' ', '')}"
               th:text="${theme.config.footer?.mobile}"></a>
          </p>
          <p>
            <span class="glyphicon glyphicon-earphone" aria-hidden="true"></span>
            <span th:text="${theme.config.footer?.phone}"></span>
          </p>
          <p>
            <span class="glyphicon glyphicon-envelope" aria-hidden="true"></span>
            <a th:href="'mailto:' + ${theme.config.footer?.email ?: ''}"
               th:text="${theme.config.footer?.email}"></a>
          </p>
          <p>
            <span class="glyphicon glyphicon-map-marker" aria-hidden="true"></span>
            <span data-i18n-key="sidebar.address"
                  th:text="${theme.config.footer?.address}"></span>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<footer class="theme-footer">
  <div class="container text-center">
    <p th:utext="${theme.config.general?.footer_text} ?: '由 &lt;a href=&quot;https://www.halo.run&quot;&gt;Halo&lt;/a&gt; 强力驱动'"></p>
    <p>
      <small th:text="${site.title} + ' © ' + ${#temporals.format(#temporals.createNow(), 'yyyy')}"></small>
    </p>
  </div>
</footer>

<script th:src="@{/assets/js/jquery.min.js}"></script>
<script th:src="@{/assets/js/bootstrap.min.js}"></script>
<script th:src="@{/assets/js/i18n.js?v={v}(v=${theme.spec.version})}"></script>
</body>
</html>
