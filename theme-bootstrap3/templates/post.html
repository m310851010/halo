<!DOCTYPE html>
<html lang="zh-CN"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:halo="urn:org.halo.thymeleaf"
      th:replace="~{layout :: html(head = null, content = ~{::content})}">
<th:block th:fragment="content">
  <div class="panel panel-default">
    <div class="panel-body">
      <h1 class="theme-post-title" th:text="${post.spec.title}"></h1>
      <p class="text-muted">
        <span class="glyphicon glyphicon-calendar" aria-hidden="true"></span>
        <time th:text="${#temporals.format(post.spec.publishTime, 'yyyy-MM-dd HH:mm')}"></time>
        <span class="glyphicon glyphicon-folder-open theme-tag-space" aria-hidden="true"
              th:if="${!#lists.isEmpty(post.categories)}"></span>
        <a class="label label-primary theme-label"
           th:each="category : ${post.categories}"
           th:href="@{${category.status.permalink}}"
           th:text="${category.spec.displayName}"></a>
        <span class="glyphicon glyphicon-tag theme-tag-space" aria-hidden="true"
              th:if="${!#lists.isEmpty(post.tags)}"></span>
        <a class="label label-default theme-label"
           th:each="tag : ${post.tags}"
           th:href="@{${tag.status.permalink}}"
           th:text="${tag.spec.displayName}"></a>
      </p>
      <hr/>
      <article class="theme-content" th:utext="${post.content.content}"></article>
    </div>
    <div class="panel-footer text-muted">
      <span class="glyphicon glyphicon-eye-open" aria-hidden="true"></span>
      <span th:text="${post.stats.visit}"></span> 次浏览
    </div>
  </div>

  <div class="panel panel-default"
       th:if="${theme.config.general?.show_comment} ?: true">
    <div class="panel-heading">评论</div>
    <div class="panel-body">
      <halo:comment th:attr="group=${'content.halo.run'},kind=${'Post'},name=${post.metadata.name}"/>
    </div>
  </div>
</th:block>
</html>
